<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Blue Ribbon BSC</title><link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><div class="auth-shell"><div class="auth-card"><div class="auth-brand"><img src="{{ url_for('static', filename='blue_ribbon_logo.png') }}" alt="Blue Ribbon"><div><strong>Blue Ribbon</strong><small>Balanced Scorecard</small></div></div><h1>Sign in</h1><p class="text-secondary">Access performance intelligence and scorecard reporting.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="mb-3"><label class="form-label">Username or email</label><input class="form-control" name="identity" value="{{ identity }}" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Keep me signed in</label></div><button class="btn btn-primary w-100" type="submit">Sign in</button></form></div></div></body></html>
